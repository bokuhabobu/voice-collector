<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Sound waves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="12" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="12" />
  <!-- Mic Body -->
  <rect x="220" y="160" width="72" height="130" rx="36" fill="#ffffff" />
  <!-- Mic Arc & Stand -->
  <path d="M 180,240 A 76,76 0 0,0 332,240" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="256" y1="316" x2="256" y2="380" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="206" y1="380" x2="306" y2="380" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <!-- Accent dot -->
  <circle cx="256" cy="210" r="10" fill="url(#waveGrad)" />
</svg>
